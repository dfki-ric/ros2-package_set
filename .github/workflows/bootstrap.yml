name: bootstrap CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '0 0 * * 1-5'

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    # Ubuntu 26.04 (ROS 2 lyrical) is nice-to-have for now: a failure does not fail the workflow
    continue-on-error: ${{ matrix.os == 'ubuntu-26.04' }}
    steps:
    # - uses: actions/checkout@v4  ## no need to checkout, this is done by autoproj_bootstrap
    - name: Install dependencies
      run: |
        sudo apt-get -y update && sudo apt-get -y install wget ruby-dev ssh git sudo build-essential libunwind-dev ccache
        git config --global user.name "GitHub runner" && git config --global user.email "runner@github.com"
      shell: bash
    # Ubuntu 26.04 has no apt-key, which autoproj needs for the key entries in ros-2.osrepos,
    # so add the ROS 2 apt source the official way (ros2-apt-source) before autoproj runs
    - name: Add ROS 2 apt source
      if: ${{ matrix.os == 'ubuntu-26.04' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version=$(gh release view --repo ros-infrastructure/ros-apt-source --json tagName --jq .tagName)
        codename=$(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}")
        gh release download "$version" --repo ros-infrastructure/ros-apt-source \
          --pattern "ros2-apt-source_${version}.${codename}_all.deb" --output /tmp/ros2-apt-source.deb
        sudo dpkg -i /tmp/ros2-apt-source.deb
        sudo apt-get -y update
    - name: bootstrap_buildconf
      env:
        PR_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        PR_BRANCH: ${{ github.head_ref }}
      run: |
        wget https://rock-robotics.org/autoproj_bootstrap
        ruby autoproj_bootstrap --no-interactive git https://github.com/dfki-ric/ros2-buildconf
        # For pull requests, take this package set from the PR branch right away: its init.rb and
        # osdeps already apply to the configuration below (switching after it would configure
        # with master's version, e.g. without a ROS_DISTRO default for a new Ubuntu release)
        if [ -n "$PR_BRANCH" ]; then
          sed -i "s|^\(\s*\)- github: dfki-ric/ros2-package_set\$|\1- github: $PR_REPO\n\1  branch: $PR_BRANCH|" autoproj/manifest
          grep -A1 -- "- github: $PR_REPO" autoproj/manifest
        fi
        # Check out packageset and configure variables
        . env.sh && aup --config --no-interactive
    - name: update
      run: |
        # -k: report all import/osdeps errors at once (still fails the step)
        source env.sh && autoproj update --no-interactive -k

    - name: Restore ccache
      id: ccache-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{ matrix.os }}-ccache-${{ github.run_id }}
        restore-keys: |
          ${{ matrix.os }}-ccache-

    - name: Configure ccache
      run: |
          ccache --max-size=1G
          ccache --set-config=compression=true

    - name: Build
      env:
        # CMake 4 (Ubuntu 26.04) rejects cmake_minimum_required < 3.5, which some packages still use
        CMAKE_POLICY_VERSION_MINIMUM: ${{ matrix.os == 'ubuntu-26.04' && '3.5' || '' }}
      run: |
          source /opt/ros/*/setup.bash
          # --continue-on-error: build everything buildable and list all failures (still fails the step)
          colcon build --continue-on-error --cmake-args "-DCMAKE_C_COMPILER_LAUNCHER=ccache" "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache" "-DCMAKE_BUILD_TYPE=Release"

    - name: Show ccache stats
      if: always()
      run: ccache -sv
    - name: Save ccache
      if: always()
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
